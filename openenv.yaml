name: ticket-routing-env
version: "1.0.0"
description: OpenEnv Ticket Routing — routes customer support tickets via three difficulty tiers

entrypoint: inference.py

endpoints:
  reset: /reset
  step: /step

method: POST

tasks:
  - id: "easy"
    name: "easy"
    description: "Route straightforward tickets to the correct team."
    difficulty: "easy"
    grader: "env.grader:grade_episode"
  - id: "medium"
    name: "medium"
    description: "Route a mixed queue of tickets where customer tier impacts priority rules."
    difficulty: "medium"
    grader: "env.grader:grade_episode"
  - id: "hard"
    name: "hard"
    description: "Handle ambiguous, emotionally charged tickets."
    difficulty: "hard"
    grader: "env.grader:grade_episode"
